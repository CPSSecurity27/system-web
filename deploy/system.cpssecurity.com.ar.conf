# system.cpssecurity.com.ar — el panel de administración de CPS Security.
#
# Archivo APARTE del sitio institucional (`cpssecurity.com.ar`), que sigue
# intacto: son dos server blocks distintos y este no lo toca. Si algo de acá
# está mal, `nginx -t` falla y el sitio viejo no se cae porque nunca se recarga
# una config rota.
#
# El front y la API salen del MISMO origen: `/api` va al backend en el 3000 y
# todo lo demás al index.html de Angular. Así no hay CORS, y el backend NO queda
# expuesto en un puerto propio a internet — escucha en el 3000 y solo nginx le
# habla.

server {
    listen 80;
    listen [::]:80;
    server_name system.cpssecurity.com.ar;

    # Certbot necesita entrar por el 80 para renovar. El resto va a HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name system.cpssecurity.com.ar;

    ssl_certificate     /etc/letsencrypt/live/system.cpssecurity.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/system.cpssecurity.com.ar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/servidorcps/SistemaCPS/web/front;
    index index.html;

    # Esto administra alarmas y guarda códigos que hacen sonar un barrio.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # HSTS: el dominio ya sirve HTTPS y no hay nada que ofrecer por HTTP.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Los códigos RF y las etiquetas viajan por acá: que no queden en un caché
    # intermedio.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # El alta de fábrica espera al provisioner (systemctl reload mosquitto
        # sobre una Raspberry): 60 s es corto para ese caso.
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # Angular es una SPA: cualquier ruta que no sea un archivo la resuelve el
    # router del navegador. Sin esto, un F5 en /alarmas/12 da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los bundles llevan hash en el nombre (outputHashing: all): se pueden
    # cachear para siempre. El index.html NO.
    location ~* \.(js|css|woff2|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 2,7 MB de bundle sobre una conexión hogareña: comprimir no es opcional.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 8 MB y no 2: por acá sube el `.bin` del firmware. El binario de hoy pesa
    # 1,2 MB y el slot OTA del equipo es de 1,75 MB, así que con 2 MB pasaba
    # raspando — y un 413 de nginx no se parece en nada a un error de la app.
    client_max_body_size 8m;
}
