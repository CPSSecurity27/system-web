# /firmware/ en el APEX — de acá bajan los equipos su actualización.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ ESTO NO SE APLICA SOLO. Va PEGADO A MANO adentro del server block 443   │
# │ del sitio institucional `cpssecurity.com.ar`, que NO vive en este repo  │
# │ y que `install-server.sh` no toca a propósito.                          │
# └─────────────────────────────────────────────────────────────────────────┘
#
# ## Por qué en el apex y no en el panel
#
# El firmware valida la URL contra `OTA_ALLOWED_HOST`, que es
# `SERVER_HOST` = `cpssecurity.com.ar`, y la comparación es de host EXACTO
# (`ota_url_is_allowed()` en `components/ota_engine/ota_version.c`):
#
#     https://cpssecurity.com.ar/firmware/...         ✓ acepta
#     https://system.cpssecurity.com.ar/firmware/...  ✗ rechaza, sin bajar nada
#
# Los dos nombres resuelven a esta misma máquina, así que es solo cuestión de
# servir la carpeta desde el server block correcto.
#
# ## Cómo aplicarlo
#
#   sudo nano /etc/nginx/sites-available/cpssecurity.com.ar   # o donde esté
#   # pegar el bloque `location` de abajo adentro del server { listen 443 ... }
#   sudo nginx -t && sudo systemctl reload nginx
#
# `nginx -t` antes del reload: si el archivo queda mal, el sitio institucional
# no se cae porque nunca se recarga una config rota.
#
# ## Verificar que quedó bien
#
#   curl -I https://cpssecurity.com.ar/firmware/alarmavecinal/ota/new/manifest.json
#
# Antes de publicar la primera versión eso da 404 (la carpeta está vacía) y está
# bien. Lo que NO tiene que dar es 404 del sitio institucional con su HTML de
# error: si la respuesta trae `Content-Type: text/html`, el `location` no está
# tomando y el equipo va a bajar una página web creyendo que es un manifiesto.
#
# La pantalla de actualizaciones tiene un botón "Verificar el servidor"
# (`GET /api/firmware/check`) que revisa el otro lado: que la carpeta exista en
# el disco y que el backend pueda escribirla.

location /firmware/ {
    alias /home/servidorcps/SistemaCPS/web/firmware/;

    # Solo lectura y nada de listados: quién baja de acá es un poste, no una
    # persona explorando. Un autoindex publicaría el catálogo entero de
    # versiones a cualquiera que pase.
    autoindex off;

    # Los `.bin` llevan la versión en el nombre y el manifiesto declara su
    # sha256, así que el contenido de una URL nunca cambia... salvo en
    # `/new/` y `/emergency/`, que son punteros y SÍ cambian al publicar.
    # Por eso el caché va corto y no "immutable": un equipo que actualiza al
    # día siguiente de publicar tiene que ver el manifiesto nuevo.
    add_header Cache-Control "public, max-age=300" always;

    # No hace falta declarar tipos: el `mime.types` de la distribución ya mapea
    # `json` → application/json y `bin` → application/octet-stream (verificado
    # en el servidor). Un bloque `types` acá REEMPLAZA el mapa entero para esta
    # location, así que agregarlo es riesgo sin beneficio.

    # Nada de gzip sobre los `.bin`: ya están comprimidos y el equipo hace
    # sha256 sobre lo que escribe en flash — una transformación en el camino le
    # rompe la verificación.
    gzip off;
}
